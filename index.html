<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TakaPay Mini App</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-4">

    <!-- Header Section -->
    <div class="bg-blue-600 text-white p-4 rounded-xl shadow-lg mb-4 text-center">
        <h1 class="text-xl font-bold">TakaPay App</h1>
        <p class="text-sm mt-1">ইউজার ID: <span id="userId">Loading...</span></p>
        <div class="mt-3 bg-white text-blue-600 p-3 rounded-lg font-bold text-2xl shadow-inner">
            <span id="balance">0.00</span> ৳
        </div>
    </div>

    <!-- Features Grid -->
    <div class="grid grid-cols-2 gap-3 mb-4">
        <!-- Watch Ads Button with Timer Task -->
        <button id="adBtn" onclick="startAdTask()" class="bg-amber-500 hover:bg-amber-600 text-white p-4 rounded-xl shadow font-semibold flex flex-col items-center justify-center">
            <span class="text-2xl mb-1" id="adIcon">📺</span>
            <span id="adText">এড দেখে আয়</span>
        </button>

        <!-- Daily Bonus -->
        <button onclick="claimBonus()" class="bg-emerald-500 hover:bg-emerald-600 text-white p-4 rounded-xl shadow font-semibold flex flex-col items-center justify-center">
            <span class="text-2xl mb-1">🎁</span>
            <span>ডেইলি বোনাস</span>
        </button>
    </div>

    <!-- Action Sections -->
    <div class="space-y-3">
        <!-- VIP Plans -->
        <div class="bg-white p-4 rounded-xl shadow border">
            <h2 class="font-bold text-lg text-gray-700 mb-2">💎 প্ল্যান কিনে আয়</h2>
            <p class="text-sm text-gray-500 mb-3">VIP প্ল্যান কিনে প্রতিদিন নিশ্চিত আয় করুন।</p>
            <button onclick="alert('প্ল্যান অপশন শীঘ্রই আসছে!')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg font-medium">প্ল্যান দেখুন</button>
        </div>

        <!-- Refer & Earn -->
        <div class="bg-white p-4 rounded-xl shadow border">
            <h2 class="font-bold text-lg text-gray-700 mb-2">👥 রেফার করুন</h2>
            <button onclick="copyReferral()" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-2 rounded-lg font-medium">রেফারেল লিংক কপি করুন</button>
        </div>

        <!-- Withdraw -->
        <div class="bg-white p-4 rounded-xl shadow border">
            <h2 class="font-bold text-lg text-gray-700 mb-2">💳 টাকা তুলুন (Withdraw)</h2>
            <p class="text-sm text-gray-500 mb-3">বিকাশ / নগদ এর মাধ্যমে পেমেন্ট নিন।</p>
            <button onclick="withdraw()" class="w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded-lg font-medium">উইথড্র রিকোয়েস্ট</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Load Balance
        let balance = parseFloat(localStorage.getItem('balance')) || 0;
        document.getElementById('balance').innerText = balance.toFixed(2);

        // Load Telegram User ID
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('userId').innerText = user.id;
        } else {
            document.getElementById('userId').innerText = "Guest Mode";
        }

        // Secure In-App Ad Task System (Bypasses Telegram black screen issue)
        let isAdRunning = false;
        function startAdTask() {
            if (isAdRunning) return;
            isAdRunning = true;

            const adBtn = document.getElementById('adBtn');
            const adText = document.getElementById('adText');
            const adIcon = document.getElementById('adIcon');
            
            adBtn.disabled = true;
            adBtn.classList.remove('bg-amber-500', 'hover:bg-amber-600');
            adBtn.classList.add('bg-gray-400', 'cursor-not-allowed');

            let timeLeft = 10; // ১০ সেকেন্ডের টাস্ক
            adIcon.innerText = "⏳";
            adText.innerText = `এড লোড হচ্ছে (${timeLeft}s)`;

            const timer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    adText.innerText = `এড দেখা হচ্ছে (${timeLeft}s)`;
                } else {
                    clearInterval(timer);
                    
                    // ব্যালেন্স যোগ করা
                    balance += 2.0;
                    updateBalance();

                    adIcon.innerText = "📺";
                    adText.innerText = "এড দেখে আয়";
                    adBtn.disabled = false;
                    adBtn.classList.remove('bg-gray-400', 'cursor-not-allowed');
                    adBtn.classList.add('bg-amber-500', 'hover:bg-amber-600');
                    isAdRunning = false;

                    alert("অভিনন্দন! সফলভাবে টাস্ক সম্পন্ন হয়েছে এবং আপনার একাউন্টে ২.০০ ৳ যোগ করা হয়েছে।");
                }
            }, 1000);
        }

        // Daily Bonus Function
        function claimBonus() {
            const lastClaim = localStorage.getItem('lastClaimDate');
            const today = new Date().toDateString();

            if (lastClaim === today) {
                alert("আপনি আজকের ডেইলি বোনাস ইতোমধ্যে নিয়ে নিয়েছেন!");
            } else {
                balance += 5.0;
                localStorage.setItem('lastClaimDate', today);
                updateBalance();
                alert("অভিনন্দন! আপনি ৫ টাকা ডেইলি বোনাস পেয়েছেন।");
            }
        }

        // Copy Referral Link
        function copyReferral() {
            const refLink = `https://t.me/TakaPayAppBot?start=${user ? user.id : 'ref'}`;
            navigator.clipboard.writeText(refLink);
            alert("আপনার রেফারেল লিংক কপি করা হয়েছে!");
        }

        // Withdraw Function
        function withdraw() {
            if (balance >= 100) {
                alert("আপনার উইথড্র রিকোয়েস্ট সাবমিট করা হয়েছে!");
            } else {
                alert("সর্বনিম্ন ১০০ টাকা হলে উইথড্র করা যাবে।");
            }
        }

        // Update Balance UI and LocalStorage
        function updateBalance() {
            localStorage.setItem('balance', balance.toFixed(2));
            document.getElementById('balance').innerText = balance.toFixed(2);
        }
    </script>
</body>
</html>
