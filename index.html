<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TakaPay Mini App</title>
​<!-- Telegram WebApp SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
​<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-4">
​<!-- Header Section -->
<div class="bg-blue-600 text-white p-4 rounded-xl shadow-lg mb-4 text-center">
<h1 class="text-xl font-bold">TakaPay App</h1>
<p class="text-sm mt-1">ইউজার ID: <span id="userId">6293441724</span></p>
<div class="mt-3 bg-white text-blue-600 p-3 rounded-lg font-bold text-2xl shadow-inner">
<span id="balance">0.00</span> ৳
</div>
</div>
​<!-- Features Grid -->
<div class="grid grid-cols-2 gap-3 mb-4">
<!-- Watch Ads Button -->
<button onclick="openAd()" class="bg-amber-500 hover:bg-amber-600 text-white p-4 rounded-xl shadow font-semibold flex flex-col items-center justify-center transition-all">
<span class="text-2xl mb-1">📺</span>
<span>এড দেখে আয়</span>
</button>
​<!-- Daily Bonus -->
<button onclick="claimBonus()" class="bg-emerald-500 hover:bg-emerald-600 text-white p-4 rounded-xl shadow font-semibold flex flex-col items-center justify-center transition-all">
<span class="text-2xl mb-1">🎁</span>
<span>ডেইলি বোনাস</span>
</button>
</div>
​<!-- Action Sections -->
<div class="space-y-3">
<!-- VIP Plans -->
<div class="bg-white p-4 rounded-xl shadow border">
<h2 class="font-bold text-lg text-gray-700 mb-2">💎 প্ল্যান কিনে আয়</h2>
<p class="text-sm text-gray-500 mb-3">VIP প্ল্যান কিনে প্রতিদিন নিশ্চিত আয় করুন।</p>
<button onclick="alert('প্ল্যান অপশন শীঘ্রই আসছে!')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg font-medium">প্ল্যান দেখুন</button>
</div>
​<!-- Refer & Earn -->
<div class="bg-white p-4 rounded-xl shadow border">
<h2 class="font-bold text-lg text-gray-700 mb-2">👥 রেফার করুন</h2>
<button onclick="copyReferral()" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-2 rounded-lg font-medium">রেফারেল লিংক কপি করুন</button>
</div>
​<!-- Withdraw -->
<div class="bg-white p-4 rounded-xl shadow border">
<h2 class="font-bold text-lg text-gray-700 mb-2">💳 টাকা তুলুন (Withdraw)</h2>
<p class="text-sm text-gray-500 mb-3">বিকাশ / নগদ এর মাধ্যমে পেমেন্ট নিন।</p>
<button onclick="withdraw()" class="w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded-lg font-medium">উইথড্র রিকোয়েস্ট</button>
</div>
</div>
​<script>
// Initialize Telegram WebApp
let tg = window.Telegram.WebApp;
try {
tg.expand();
tg.ready();
} catch (e) {}
​// Set User ID safely
let currentUserId = "6293441724";
try {
if (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
currentUserId = tg.initDataUnsafe.user.id;
}
} catch (e) {}
document.getElementById('userId').innerText = currentUserId;
​// Restore Original LocalStorage Key
let balance = parseFloat(localStorage.getItem('takapay_balance'));
if (isNaN(balance) || balance === 0) {
balance = 60.00; // Restore user's previous balance
}
document.getElementById('balance').innerText = balance.toFixed(2);
​// Open Real Direct Ad Link
function openAd() {
const adUrl = "https://uplcm.com/4/12006163";
​// Try to open link in external Chrome/Browser
try {
if (tg && tg.openLink) {
tg.openLink(adUrl, { try_instant_view: false });
} else {
window.open(adUrl, '_blank');
}
} catch (e) {
window.open(adUrl, '_blank');
}
​// Reward User
balance += 2.0;
updateBalance();
alert("বিজ্ঞাপন ওপেন করার চেষ্টা করা হয়েছে! আপনার একাউন্টে ২.০০ ৳ যোগ করা হয়েছে।");
}
​// Daily Bonus Function
function claimBonus() {
const lastClaim = localStorage.getItem('takapay_lastClaim');
const today = new Date().toDateString();
​if (lastClaim === today) {
alert("আপনি আজকের ডেইলি বোনাস ইতোমধ্যে নিয়ে নিয়েছেন!");
} else {
balance += 5.0;
localStorage.setItem('takapay_lastClaim', today);
updateBalance();
alert("অভিনন্দন! আপনি ৫ টাকা ডেইলি বোনাস পেয়েছেন।");
}
}
​// Copy Referral Link
function copyReferral() {
const refLink = https://t.me/TakaPayAppBot?start=${currentUserId};
navigator.clipboard.writeText(refLink);
alert("আপনার রেফারেল লিংক কপি করা হয়েছে!");
}
​// Withdraw Function
function withdraw() {
if (balance >= 100) {
alert("আপনার উইথড্র রিকোয়েস্ট সফলভাবে সাবমিট করা হয়েছে!");
} else {
alert("সর্বনিম্ন ১০০ টাকা হলে উইথড্র করা যাবে।");
}
}
​// Update Balance
function updateBalance() {
localStorage.setItem('takapay_balance', balance.toFixed(2));
document.getElementById('balance').innerText = balance.toFixed(2);
}
</script>
</body>
  </html>
