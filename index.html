<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TakaPay Mini App</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 20px; margin: 0; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin: 15px auto; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 12px 20px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; }
        button:hover { background: #0ea5e9; }
        input, select { width: 100%; padding: 10px; margin-top: 8px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
    </style>
</head>
<body>

    <h1>TakaPay</h1>
    
    <div class="card">
        <h3>আপনার ব্যালেন্স</h3>
        <h2 id="balance">৳0.00</h2>
    </div>

    <div class="card">
        <h3>রেফারেল লিংক</h3>
        <p id="refLink" style="word-break: break-all; color: #38bdf8; font-size: 14px;"></p>
        <button onclick="copyRefLink()">লিংক কপি করুন</button>
    </div>

    <div class="card">
        <h3>টাকা উত্তোলন (Withdraw)</h3>
        <select id="method">
            <option value="bkash">বিকাশ (bKash)</option>
            <option value="nagad">নগদ (Nagad)</option>
        </select>
        <input type="text" id="account" placeholder="অ্যাকাউন্ট নাম্বার (যেমন: 017XXXXXXXX)">
        <input type="number" id="amount" placeholder="টাকার পরিমাণ">
        <button onclick="requestWithdrawal()">উত্তোলন করুন</button>
    </div>

    <script>
        // Supabase কনফিগারেশন
        const SUPABASE_URL = 'https://xkkzrfjzhbxgsqpejbwd.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_rkd7l-PFMFt2W1aAtdPcRQ_AN_xg30q';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // টেলিগ্রাম ইউজার ইনিশিয়ালাইজেশন
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ইউজারের ইউনিক আইডি (টেলিগ্রাম আইডি অথবা টেস্ট আইডি)
        const userId = tg.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : 'test_user_' + Math.floor(Math.random() * 1000);
        
        // রেফারেল চেক (যদি কেউ রেফারেল লিংকে প্রবেশ করে)
        const urlParams = new URLSearchParams(window.location.search);
        const refBy = urlParams.get('start');

        async function initUser() {
            // ১. ইউজার ডাটা আছে কিনা চেক করা
            let { data: user, error } = await supabaseClient
                .from('users')
                .select('*')
                .eq('id', userId)
                .single();

            if (!user) {
                // নতুন ইউজার হলে ডাটাবেজে এন্ট্রি করা
                let referrer = (refBy && refBy !== userId) ? refBy : null;
                
                await supabaseClient.from('users').insert([
                    { id: userId, balance: 10.00, referred_by: referrer } // সাইনআপ বোনাস ১০ টাকা
                ]);

                // যদি রেফারার থাকে, তাকে বোনাস দেওয়া
                if (referrer) {
                    let { data: refUser } = await supabaseClient.from('users').select('balance').eq('id', referrer).single();
                    if (refUser) {
                        await supabaseClient.from('users').update({ balance: Number(refUser.balance) + 5.00 }).eq('id', referrer); // রেফার বোনাস ৫ টাকা
                    }
                }
                loadUserData();
            } else {
                updateUI(user.balance);
            }
        }

        async function loadUserData() {
            let { data: user } = await supabaseClient.from('users').select('*').eq('id', userId).single();
            if (user) {
                updateUI(user.balance);
            }
        }

        function updateUI(balance) {
            document.getElementById('balance').innerText = '৳' + Number(balance).toFixed(2);
            const botUsername = "YourTelegramBotUsername"; // আপনার বটের ইউজারনেম এখানে বসাবেন
            const refUrl = `https://t.me/${botUsername}?start=${userId}`;
            document.getElementById('refLink').innerText = refUrl;
        }

        function copyRefLink() {
            const refText = document.getElementById('refLink').innerText;
            navigator.clipboard.writeText(refText);
            alert('রেফারেল লিংক কপি করা হয়েছে!');
        }

        async function requestWithdrawal() {
            const method = document.getElementById('method').value;
            const account = document.getElementById('account').value;
            const amount = parseFloat(document.getElementById('amount').value);

            if (!account || !amount || amount <= 0) {
                alert('সঠিক অ্যাকাউন্ট নাম্বার এবং পরিমাণ লিখুন।');
                return;
            }

            // ব্যালেন্স চেক করা
            let { data: user } = await supabaseClient.from('users').select('balance').eq('id', userId).single();
            if (!user || user.balance < amount) {
                alert('পর্যাপ্ত ব্যালেন্স নেই!');
                return;
            }

            // উইথড্রয়াল রিকোয়েস্ট সেভ করা
            let { error: wError } = await supabaseClient.from('withdrawals').insert([
                { user_id: userId, method: method, account: account, amount: amount, status: 'pending' }
            ]);

            if (wError) {
                alert('ত্রুটি হয়েছে: ' + wError.message);
                return;
            }

            // ইউজারের অ্যাকাউন্ট থেকে ব্যালেন্স কেটে নেওয়া
            let newBalance = Number(user.balance) - amount;
            await supabaseClient.from('users').update({ balance: newBalance }).eq('id', userId);

            alert('উইথড্রয়াল সফলভাবে সাবমিট হয়েছে!');
            loadUserData();
            document.getElementById('account').value = '';
            document.getElementById('amount').value = '';
        }

        initUser();
    </script>
</body>
</html>
