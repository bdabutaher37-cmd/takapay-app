<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TakaPay Mini App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: #0f172a;
            color: #ffffff;
            font-family: sans-serif;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
        }
    </style>
</head>
<body class="p-4 pb-24">

    <!-- Header -->
    <div class="card p-4 flex justify-between items-center mb-4">
        <div>
            <p class="text-xs text-gray-400">ইউজার আইডি</p>
            <p id="uid" class="font-bold text-sm text-indigo-300">6293441724</p>
        </div>
        <span class="bg-amber-500/20 text-amber-400 text-xs px-3 py-1 rounded-full">ফ্রি প্ল্যান</span>
    </div>

    <!-- Views -->
    <div id="homeView" class="view space-y-4">
        <div class="card p-5 bg-gradient-to-r from-indigo-900 to-purple-900">
            <p class="text-xs text-gray-300">আপনার মূল ব্যালেন্স</p>
            <h2 class="text-3xl font-extrabold my-2">৳ <span id="bal">0.00</span></h2>
        </div>
        <div class="card p-4 text-center">
            <p class="text-xs text-gray-400">ডেইলি টাস্ক বোনাস</p>
            <p class="font-bold text-amber-300">৳ ৪০.০০ পর্যন্ত</p>
        </div>
    </div>

    <div id="tasksView" class="view hidden space-y-4">
        <h2 class="font-bold text-indigo-300">দৈনিক টাস্কসমূহ</h2>
        <div class="card p-4 flex justify-between items-center">
            <div>
                <p class="font-semibold text-sm">ভিডিও বিজ্ঞাপন দেখুন</p>
                <p class="text-xs text-emerald-400">+৳ ২.০০</p>
            </div>
            <button onclick="addMoney()" class="bg-indigo-600 text-xs px-4 py-2 rounded-xl">দেখুন</button>
        </div>
    </div>

    <div id="plansView" class="view hidden space-y-4">
        <h2 class="font-bold text-indigo-300">ভিআইপি প্ল্যান</h2>
        <div class="card p-4">
            <h3 class="font-bold text-amber-300">গোল্ড প্ল্যান - ৳ ৫০০</h3>
            <button onclick="alert('বিকাশ করুন: 01318774526')" class="w-full mt-3 bg-amber-600 text-xs py-2 rounded-xl font-bold">প্ল্যান কিনুন</button>
        </div>
    </div>

    <div id="withdrawView" class="view hidden space-y-4">
        <h2 class="font-bold text-indigo-300">টাকা তুলুন</h2>
        <div class="card p-4 space-y-3">
            <input id="wNum" type="number" placeholder="বিকাশ নম্বর" class="w-full bg-slate-800 p-3 rounded-xl text-xs text-white">
            <input id="wAmt" type="number" placeholder="পরিমাণ (কমপক্ষে ১০০ টাকা)" class="w-full bg-slate-800 p-3 rounded-xl text-xs text-white">
            <button onclick="withdraw()" class="w-full bg-emerald-600 py-3 rounded-xl text-xs font-bold">উইথড্র করুন</button>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="fixed bottom-0 left-0 right-0 bg-slate-950 border-t border-white/10 p-3 flex justify-around">
        <button onclick="showTab('home')" class="text-sky-400 text-xs"><i class="fa-solid fa-house text-lg"></i><br>হোম</button>
        <button onclick="showTab('tasks')" class="text-gray-400 text-xs"><i class="fa-solid fa-list text-lg"></i><br>টাস্ক</button>
        <button onclick="showTab('plans')" class="text-gray-400 text-xs"><i class="fa-solid fa-gem text-lg"></i><br>প্ল্যান</button>
        <button onclick="showTab('withdraw')" class="text-gray-400 text-xs"><i class="fa-solid fa-wallet text-lg"></i><br>উইথড্র</button>
    </div>

    <script>
        let balance = 0.00;

        function showTab(tab) {
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            document.getElementById(tab + 'View').classList.remove('hidden');
        }

        function addMoney() {
            balance += 2.00;
            document.getElementById('bal').innerText = balance.toFixed(2);
            alert('২ টাকা যোগ হয়েছে!');
        }

        function withdraw() {
            const amt = parseFloat(document.getElementById('wAmt').value);
            if (!amt || amt < 100) {
                alert('কমপক্ষে ১০০ টাকা হতে হবে!');
                return;
            }
            if (amt > balance) {
                alert('পর্যাপ্ত ব্যালেন্স নেই!');
                return;
            }
            balance -= amt;
            document.getElementById('bal').innerText = balance.toFixed(2);
            alert('উইথড্র সফল হয়েছে!');
        }
    </script>
</body>
</html>
