<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TakaPay - Earn Money</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- AdsGram SDK -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between p-4 font-sans">

  <!-- Main Container -->
  <div class="max-w-md mx-auto w-full space-y-6">
    
    <!-- Header / Balance Section -->
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 text-center shadow-lg">
      <h1 class="text-xl font-bold text-slate-400">আপনার বর্তমান ব্যালেন্স</h1>
      <div class="text-4xl font-extrabold text-amber-400 mt-2">
        <span id="userBalance">0</span> <span class="text-lg text-slate-300">টাকা</span>
      </div>
    </div>

    <!-- Ads Task Section -->
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 space-y-4 shadow-lg">
      <h2 class="text-lg font-semibold text-slate-200">বিজ্ঞাপন দেখে আয় করুন</h2>
      <p class="text-sm text-slate-400">প্রতিটি ভিডিও বিজ্ঞাপন দেখার জন্য পাবেন ৫০ পয়সা (০.৫০ টাকা)।</p>
      
      <button id="watchAdBtn" onclick="showRewardAd()" class="w-full bg-emerald-500 hover:bg-emerald-600 active:scale-95 transition-all text-slate-950 font-bold py-3 rounded-xl shadow-md flex items-center justify-center gap-2">
        <span>🎬</span> অ্যাড দেখুন ও আয় করুন
      </button>
    </div>

    <!-- Referral Section -->
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 space-y-3 shadow-lg">
      <h2 class="text-lg font-semibold text-slate-200">রেফার করে আয়</h2>
      <p class="text-sm text-slate-400">বন্ধুদের সাথে শেয়ার করুন এবং বোনাস পান!</p>
      <button onclick="shareReferral()" class="w-full bg-sky-500 hover:bg-sky-600 active:scale-95 transition-all text-slate-950 font-bold py-3 rounded-xl shadow-md flex items-center justify-center gap-2">
        <span>🚀</span> রেফার লিংক কপি করুন
      </button>
    </div>

  </div>

  <!-- Footer -->
  <div class="text-center text-xs text-slate-500 my-4">
    TakaPay Telegram Mini App &copy; 2026
  </div>

  <!-- JavaScript Logic -->
  <script>
    // Telegram WebApp Initialization
    const tg = window.Telegram.WebApp;
    tg.expand();

    // User Balance State
    let balance = parseFloat(localStorage.getItem('takaPayBalance')) || 0.00;
    document.getElementById('userBalance').innerText = balance.toFixed(2);

    // AdsGram Integration Setup (Block ID: 53351)
    const AdController = window.Adsgram.init({ blockId: "53351" });

    // Function to Show Ads
    function showRewardAd() {
      const btn = document.getElementById('watchAdBtn');
      btn.disabled = true;
      btn.innerText = "অ্যাড লোড হচ্ছে...";

      AdController.show().then((result) => {
        // User finished watching the ad
        balance += 0.50; // Reward amount
        localStorage.setItem('takaPayBalance', balance.toFixed(2));
        document.getElementById('userBalance').innerText = balance.toFixed(2);

        tg.showAlert("অভিনন্দন! আপনি ০.৫০ টাকা রিওয়ার্ড পেয়েছেন।");
        resetButton();
      }).catch((result) => {
        // Ad error or user closed the ad early
        tg.showAlert("বিজ্ঞাপন সম্পূর্ণ না দেখলে রিওয়ার্ড পাওয়া যাবে না। আবার চেষ্টা করুন।");
        resetButton();
      });
    }

    // Reset Button State
    function resetButton() {
      const btn = document.getElementById('watchAdBtn');
      btn.disabled = false;
      btn.innerHTML = '<span>🎬</span> অ্যাড দেখুন ও আয় করুন';
    }

    // Referral Share Logic
    function shareReferral() {
      const user = tg.initDataUnsafe?.user;
      const userId = user ? user.id : '12345';
      const refLink = `https://t.me/TakaPayAppBot/takapay?startapp=ref_${userId}`;

      navigator.clipboard.writeText(refLink).then(() => {
        tg.showAlert("রেফারেল লিংক কপি হয়েছে!\n" + refLink);
      }).catch(() => {
        tg.showAlert("লিংক কপি করতে সমস্যা হয়েছে।");
      });
    }
  </script>
</body>
</html>
